<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방 배치 시뮬레이터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>방 배치 시뮬레이터</h1>
    </header>

    <div class="layout">
      <aside class="panel">
        <section class="card">
          <h2>방 크기</h2>
          <div class="field-row">
            <label>가로(m)
              <input id="roomWidth" type="number" min="0.5" max="30" step="0.1" value="4">
            </label>
            <label>세로(m)
              <input id="roomHeight" type="number" min="0.5" max="30" step="0.1" value="3">
            </label>
          </div>
          <button id="applyRoom" class="btn primary">방 크기 적용</button>
          <div class="area-info">
            <div>전체 넓이: <strong id="areaM2">-</strong> m²</div>
            <div>평수: <strong id="areaPyeong">-</strong> 평</div>
          </div>
        </section>

        <section class="card">
          <h2>가구 추가</h2>
          <div class="furniture-list" id="furnitureButtons"></div>
        </section>

        <section class="card">
          <h2>선택한 가구</h2>
          <div id="selectedPanel" class="selected-panel">
            <p class="hint">캔버스에서 가구를 클릭하면 여기서 회전·삭제할 수 있어요.</p>
          </div>
        </section>

        <section class="card">
          <h2>면적 현황</h2>
          <div id="statusBox">
            <div>겹침/이탈: <strong id="collisionStatus">없음</strong></div>
            <div>가구 차지 면적: <strong id="usedArea">0.00</strong> m²</div>
            <div>남은 바닥 면적: <strong id="remainingArea">-</strong> m²</div>
          </div>
        </section>
      </aside>

      <main class="canvas-wrap" id="canvasWrap">
        <canvas id="planCanvas"></canvas>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
